services:
  - type: web
    name: voxel-support-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.17.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 1
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: SUPPORT_OWNER_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
